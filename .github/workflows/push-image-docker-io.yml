name: Push image to docker hub

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'src/**'

env:
  PLATAFORM_ARCH: linux/amd64
  CONTAINER_REPO: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}
  
jobs:
  build:
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: ${{ env.PLATAFORM_ARCH }}
                
      - name: Build and push - Public branch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: BRANCHE=public
          platforms: ${{ env.PLATAFORM_ARCH }}
          push: true
          tags: |
            ${{ env.CONTAINER_REPO }}:latest
            ${{ env.CONTAINER_REPO }}:stable
            ${{ env.CONTAINER_REPO }}:42

      - name: Build and push - Legacy 42 branch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: BRANCHE=legacy42
          platforms: ${{ env.PLATAFORM_ARCH }}
          push: true
          tags: |
            ${{ env.CONTAINER_REPO }}:42.19

      - name: Build and push - Legacy 41 branch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: BRANCHE=legacy41
          platforms: ${{ env.PLATAFORM_ARCH }}
          push: true
          tags: |
            ${{ env.CONTAINER_REPO }}:41