name: Push image to ghcr.io

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'src/**'

env:
  PLATAFORM_ARCH: linux/amd64
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1
  
jobs:
  build:
    
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ GITHUB.REPOSITORY_OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: ${{ env.PLATAFORM_ARCH }}
          #driver-opts: image=moby/buildkit:master
                
      - name: Build and push - Public branch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATAFORM_ARCH }}
          push: true
          build-args: BRANCHE=public
          #proveance: false
          #sbom: false  
          tags: |
            ghcr.io/${{ GITHUB.REPOSITORY }}:latest
            ghcr.io/${{ GITHUB.REPOSITORY }}:stable
            ghcr.io/${{ GITHUB.REPOSITORY }}:42

      - name: Build and push - Legacy 42 branch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATAFORM_ARCH }}
          push: true
          build-args: BRANCHE=legacy42
          #proveance: false
          #sbom: false  
          tags: |
            ghcr.io/${{ GITHUB.REPOSITORY }}:42.19

      - name: Build and push - Legacy 41 branch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATAFORM_ARCH }}
          push: true
          build-args: BRANCHE=legacy41
          #proveance: false
          #sbom: false  
          tags: |
            ghcr.io/${{ GITHUB.REPOSITORY }}:41