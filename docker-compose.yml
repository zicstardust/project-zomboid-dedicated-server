services:
  pzserver_stable:
    container_name: pzserver_${BRANCHE:-stable}
    image: project-zomboid-dedicated-server:${BRANCHE:-latest}
    build:
      args:
        BRANCHE: ${BRANCHE:-public}
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - 16261:16261/udp #Default Port
      - 16262:16262/udp #Direct Connection
      - 27015:27015 #Rcon
    volumes:
      - ./data:/data